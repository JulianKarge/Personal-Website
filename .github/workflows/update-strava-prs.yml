name: Update Strava Running PRs

on:
  schedule:
    # Runs täglich um 6:00 Uhr UTC (8:00 Uhr MESZ im Sommer, 7:00 Uhr MEZ im Winter)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Erlaubt manuelles Auslösen über GitHub UI

jobs:
  update-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install requests python-dotenv

      - name: Create .env file with secrets
        run: |
          echo "STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}" > ../python/.env
          echo "STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}" >> ../python/.env
          echo "STRAVA_REFRESH_TOKEN=${{ secrets.STRAVA_REFRESH_TOKEN }}" >> ../python/.env
        working-directory: .

      - name: Fetch Strava data and calculate PRs
        run: |
          cd ../python
          python strava_fetch.py
        working-directory: .

      - name: Check if PRs were updated
        id: check_changes
        run: |
          if git diff --quiet data/running_prs.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/running_prs.json
          git commit -m "🏃 Auto-update: Strava running PRs - $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "✅ Keine neuen PRs - Daten sind aktuell!"
